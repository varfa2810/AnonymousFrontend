<section class="login-page">
  <div class="login-card">
    <div class="login-card__header">
      <h2>Welcome Back</h2>
      <p>Provide your credentials to continue.</p>
    </div>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>
      @if (loginErrorMessage()) {
      <div class="login-inline-error" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>{{ loginErrorMessage() }}</span>
      </div>
      }

      <div class="login-field">
        <label for="username">Username</label>
        <div class="login-input-wrap" [class.is-invalid]="hasError('username', 'required')">
          <input
            type="text"
            id="username"
            formControlName="username"
            placeholder="Enter your username"
            autocomplete="username"
            (input)="clearLoginError()"
          />  
          <span class="login-input-icon">
            <i class="bi bi-person-circle"></i>
          </span>
        </div>
        @if (hasError('username', 'required')) {
        <small class="field-error">Username is required.</small>
        }
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <div class="login-input-wrap" [class.is-invalid]="hasError('password', 'required')">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            (input)="clearLoginError()"
          />

          <button
            type="button"
            class="login-input-icon login-input-icon--button"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <i [className]="showPassword ? 'bi-eye-slash' : 'bi-key'"></i>
          </button>
        </div>
        @if (hasError('password', 'required')) {
        <small class="field-error">Password is required.</small>
        }
      </div>

      <div class="login-actions-row">
        <a routerLink="/register" class="login-secondary-link">Need an account?</a>
      </div>

      <button type="submit" class="login-submit" [disabled]="isLoggingIn()">
        @if (isLoggingIn()) {
        <span class="login-submit__content">
          <span class="login-submit__spinner" aria-hidden="true"></span>
          <span>Logging in...</span>
        </span>
        } @else {
        <span class="login-submit__content">Login</span>
        }
      </button>
    </form>
  </div>
</section>
