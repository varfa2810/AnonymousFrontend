<section class="pt-2 pb-3">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">
        <h2 class="text-white fw-bold mb-3">My Comments</h2>

        @for (comment of comments; track comment.id) {
          <div class="card comment-card border-0 shadow rounded-4 text-white overflow-hidden mb-3">
            <div class="card-body pt-3 pb-4 px-4 px-md-5">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="badge text-bg-danger fs-6">#{{ comment.id }}</span>
                <small class="text-white fst-italic">Created: {{ comment.createdAt }}</small>
              </div>

              <p class="text-light mb-0">{{ comment.content }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
