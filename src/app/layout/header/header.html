<nav class="navbar navbar-expand-lg navbar-dark app-header py-2 py-lg-3">
  <div class="container">
    <a class="navbar-brand app-brand fw-bold d-flex align-items-center gap-2" routerLink="/request">
      <span class="brand-icon d-inline-flex align-items-center justify-content-center">
        <i class="bi bi-incognito"></i>
      </span>
      <span>Anonymous</span>
    </a>

    <button
      class="navbar-toggler border-0 p-2"
      type="button"
      aria-controls="mainNavbar"
      [attr.aria-expanded]="isNavbarOpen"
      aria-label="Toggle navigation"
      (click)="toggleNavbar($event)"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar" [class.show]="isNavbarOpen">
      <ul class="navbar-nav gap-2 gap-lg-3 text-center align-items-center mx-auto py-3 py-lg-0">
        <li class="nav-item">
          <a
            class="nav-link app-nav-link fs-6 fw-semibold px-3 py-2 rounded-pill"
            routerLink="/request"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="onNavClick()"
          >
            <i class="bi bi-send me-2"></i> Request
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link app-nav-link fs-6 fw-semibold px-3 py-2 rounded-pill"
            routerLink="/comments"
            routerLinkActive="active-link"
            (click)="onCommentsNavClick($event)"
          >
            <i class="bi bi-chat-dots me-2"></i>All Comments
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link app-nav-link fs-6 fw-semibold px-3 py-2 rounded-pill"
            routerLink="/my-comments"
            routerLinkActive="active-link"
            (click)="onNavClick()"
          >
            <i class="bi bi-chat-left-text me-2"></i> My Comments
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link app-nav-link fs-6 fw-semibold px-3 py-2 rounded-pill"
            routerLink="/rules"
            routerLinkActive="active-link"
            (click)="onNavClick()"
          >
            <i class="bi bi-shield-check me-2"></i> Rules
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link app-nav-link fs-6 fw-semibold px-3 py-2 rounded-pill"
            routerLink="/about"
            routerLinkActive="active-link"
            (click)="onNavClick()"
          >
            <i class="bi bi-stars me-2"></i> About
          </a>
        </li>
      </ul>

      <div
        class="d-flex justify-content-end mt-3 mt-lg-0 app-user-menu"
        (click)="$event.stopPropagation()"
      >
        <div class="position-relative">
          <button
            type="button"
            class="btn app-action-btn app-user-btn rounded-pill px-3 d-flex align-items-center"
            [attr.aria-expanded]="isUserMenuOpen"
            (click)="toggleUserMenu($event)"
          >
            <span class="d-flex align-items-center gap-2">
              <i class="bi bi-person-circle"></i>
              <span class="fw-semibold text-truncate">Welcome, {{ username() || 'Username' }}</span>
            </span>
            <i
              class="bi"
              [class.bi-chevron-up]="isUserMenuOpen"
              [class.bi-chevron-down]="!isUserMenuOpen"
            ></i>
          </button>

          <div
            class="dropdown-menu dropdown-menu-end app-user-dropdown"
            [class.show]="isUserMenuOpen"
          >
            <p-confirmpopup />
            <a
              class="dropdown-item d-flex align-items-center gap-2"
              routerLink="/settings"
              (click)="onNavClick()"
            >
              <i class="bi bi-gear"></i>
              <span>Settings</span>
            </a>
            <div class="app-dropdown-divider"></div>
            <div class="app-logout-shell">
              <button
                type="button"
                class="app-logout-btn w-100 d-flex align-items-center justify-content-between"
                (click)="logout($event)"
              >
                <span class="d-flex align-items-center gap-2">
                  <i class="bi bi-box-arrow-right"></i>
                  <span>Logout</span>
                </span>
                <i class="bi bi-chevron-right app-logout-chevron"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
